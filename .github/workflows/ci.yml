name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies (single source of truth: requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
      - name: Dependency consistency check
        run: pip check
      - name: Apply database migrations
        env:
          APP_ENV: test
          SECRET_KEY: ci-only-secret-key-0123456789abcdef0123456789abcdef
          DATABASE_URL: sqlite:///./ci_migrations.db
        run: python -m alembic upgrade head
      - name: Run tests
        env:
          APP_ENV: test
          REQUIRE_AUTH: "false"
          REQUIRE_ADMIN_AUTH: "false"
          LOG_FORMAT: text
          PROVIDER_EGRESS_ALLOWLIST: "api.openai.com,api.anthropic.com,generativelanguage.googleapis.com"
        run: python -m pytest tests/ -q
