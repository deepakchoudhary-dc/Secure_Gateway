name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies (test subset)
        run: |
          pip install --no-cache-dir fastapi==0.104.1 uvicorn[standard]==0.24.0 \
            pydantic==1.10.13 requests==2.31.0 sqlalchemy==2.0.23 alembic==1.13.1 \
            "httpx>=0.24,<0.28" PyJWT pytest==7.4.3 pytest-asyncio==0.21.1 python-dotenv scikit-learn numpy cryptography
      - name: Run tests
        env:
          APP_ENV: test
          REQUIRE_AUTH: "false"
          REQUIRE_ADMIN_AUTH: "false"
          LOG_FORMAT: text
          PROVIDER_EGRESS_ALLOWLIST: "api.openai.com,api.anthropic.com,generativelanguage.googleapis.com"
        run: python -m pytest tests/ -q
